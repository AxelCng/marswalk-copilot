# MarsWalk Copilot — servidor en la nube (se suma a docker-compose.yml, no lo reemplaza)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Diferencias con la PC:
#   - El modelo corre en Groq (API gratuita con GPU, compatible con OpenAI): no hace falta laptop prendida.
#     llm/llm_client.py traduce entre Groq y el copiloto; en las PCs se sigue usando Ollama.
#   - Caddy da HTTPS automático (sin HTTPS el navegador bloquea el micrófono y no hay voz).
#   - Solo se publican los puertos 80 y 443; la API y nginx quedan dentro de Docker.
# Variables: copiar deploy/.env.example como .env en la raíz y completarlo.
services:
  api:
    ports: !reset []
    environment:
      LLM_PROVIDER: openai
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${GROQ_API_KEY:?falta GROQ_API_KEY en .env}
      MODELO: ${MODELO:-llama-3.3-70b-versatile}

  web:
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificados: no se piden de nuevo en cada reinicio
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
