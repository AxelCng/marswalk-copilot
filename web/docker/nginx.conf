server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/estaciones -> http://api:8000/estaciones
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # el chat con un modelo en CPU puede tardar ~1 min por pregunta
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ~* \.(geojson)$ { types { application/geo+json geojson; } }

    # app de una sola página
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
}
