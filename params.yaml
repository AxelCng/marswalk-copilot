# MarsWalk Copilot — cost model and engine parameters.
# One file for everyone. data/ (Pedro) reads it to build graph.json
# and engine/ (Said) to filter and optimize.
# Review: Statistics teammate (Sunday 15:00-19:00).
#
# Each value says where it comes from:
#   [dato]     comes from NASA/USGS data
#   [formula]  published formula (Tobler)
#   [supuesto] our own choice (assumption); presented as an assumption in the demo

costo:
  celda_m: 20                 # [dato] CTX DTM cell size (SIM 3464)
  tobler:                     # [formula] v = a * exp(-b * |tan(theta) + c|)  in km/h
    a: 6.0
    b: 3.5
    c: 0.05
  factor_traje: 0.80          # [supuesto] fraction of the walking speed on Earth
  theta_max_fisico_deg: 30    # [supuesto] above this, the cell is blocked
  # precomputed graph versions. They were [15, 20, 25], but with the real DTM every station can already
  # be reached at 15° and the slope demo changed nothing (data/HALLAZGO_pendiente_demo.md).
  # At 8° the upper delta (E2) is left out; at 12° it fits. Team decision, Sat 14 (option A).
  limites_pendiente_deg: [8, 12, 15]
  f_terreno:                  # [supuesto] multipliers on time
    roca_expuesta: 1.20       # warm THEMIS night
    arena_fina: 1.30          # cold THEMIS night
    normal: 1.00
  themis_noche_umbral_K:      # [supuesto] cutoffs to classify the ground
    roca: 220
    arena: 200
  k_energia: 0.05             # [supuesto] energia_rel = tiempo * (1 + k * pendiente_deg)

radiacion:
  dosis_base_rel: 1.0         # [supuesto] there is no RAD at Jezero; relative index per minute
  azimuts_blindaje: 8         # [supuesto] fraction of sky blocked by the relief

comms:
  radio_visibilidad_m: 1500   # [supuesto] line-of-sight range
  umbral_cobertura_com_pct: 60  # [supuesto] "comms" alert: edges below this are removed

mision:
  origen: HAB
  tiempo_max_min_default: 240
  pendiente_max_default_deg: 15
  penalidad_por_valor: 1000   # [supuesto] K in AddDisjunction: penalty = valor_cientifico * K
